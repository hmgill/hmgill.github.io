#-------------------------------
# Gallery Page Settings
#
# Each entry under `sections` becomes its own titled block on /gallery/.
# `layout` controls how the items are rendered:
#   models  -> screenshot cards that open a .glb in the 3D viewer popup
#   images  -> plain image grid (click-to-zoom, uses the theme's overlay)
#
# Add a new section by copying a block and giving it a unique `id`.
#-------------------------------

page:
  title: Gallery
  description: A collection of scanned specimens, renders, and visual work.

sections:
  - title: 3D Fossil Gallery
    id: fossils
    description: 2D -> 3D Fossil Scans | Matrix Fossil Agent, Meshy AI
    layout: models
    columns: 3          # cards per row on desktop: 2, 3, or 4
    items:
      - title: Trilobite
        subtitle: Zlichovasis rugosa
        image: /images/gallery/fossils/trilobite.PNG
        model: /models/fossils/trilobite.glb
        caption: Lower Devonian. Lhandar Formation.
        # poster: /images/gallery/fossils/trilobite-poster.webp   # optional, shown while the model loads
        download: true  

      - title: Green River Formation Fish
        subtitle: Diplomystus dentatus
        image: /images/gallery/fossils/fish1.PNG
        model: /models/fossils/fish1.glb
        caption: Green River Formation. Wyoming.
        download: true

      - title: Unknown Fish
        subtitle: Unknown 
        image: /images/gallery/fossils/fish2.PNG
        model: /models/fossils/fish2.glb
        caption: Green River Formation. Wyoming.
        download: true

      - title: Ammonite 
        subtitle: Unknown  
        image: /images/gallery/fossils/shell.PNG
        model: /models/fossils/shell.glb
        caption: Wyoming.
        download: true
        
      - title: Petrified Wood 
        subtitle: Unknown  
        image: /images/gallery/fossils/wood1.PNG
